<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Portofolio Siswa - Kei Tedjo</title>

  <style>
    /* === IMPORT FONTS === */
    @font-face {
      font-family: 'TaroBoba';
      src: url('TaroBoba-Regular.otf') format('opentype');
    }
    @font-face {
      font-family: 'TooFreakinCute';
      src: url('Too Freakin Cute Demo.ttf') format('truetype');
    }

    /* === PAGE STYLE === */
    body {
      background: #ffeaf6;
      margin: 0;
      padding: 45px 0;
      font-family: 'TaroBoba', sans-serif;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 50px;
      border-radius: 25px;
      box-shadow: 0px 0px 30px rgba(255, 177, 220, 0.45);
    }

    h1 {
      font-family: 'TooFreakinCute', cursive;
      font-size: 3.2em;
      color: #ff66ad;
      margin-bottom: 10px;
    }

    .intro {
      font-size: 1.4em;
      color: #444;
      margin-bottom: 30px;
    }

    /* === SEARCH BAR === */
    .search-box input {
      width: 85%;
      padding: 14px;
      border-radius: 14px;
      border: 2px solid #ffb8db;
      outline: none;
      font-size: 20px;
      font-family: 'TaroBoba', sans-serif;
      background: #fff7fc;
      transition: 0.3s;
    }
    .search-box input:focus {
      border-color: #ff7db5;
      box-shadow: 0 0 10px rgba(255, 141, 205, 0.6);
    }

    /* === PROJECT CARD === */
    .project {
      background: #fff0fa;
      border-left: 8px solid #ff8aca;
      padding: 28px;
      margin: 35px 0;
      border-radius: 18px;
      text-align: left;
      transition: 0.3s;
    }
    .project:hover {
      transform: scale(1.01);
      box-shadow: 0 0 20px rgba(255, 162, 232, 0.35);
    }
    .project h3 {
      font-family: 'TooFreakinCute', cursive;
      font-size: 2em;
      color: #d9279f;
      margin-bottom: 12px;
    }

    /* === IMAGES SAME SIZE BANNER === */
    .project img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 14px;
      margin: 15px 0;
    }

    /* === BUTTONS === */
    .btn, .toggle-btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      font-family: 'TaroBoba', sans-serif;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
      margin-right: 8px;
    }

    .btn {
      background: #ff77c3;
      color: white;
    }
    .btn:hover {
      background: #ff4da9;
    }

    .toggle-btn {
      background: #ffd3ef;
      color: #b80083;
    }
    .toggle-btn:hover {
      background: #ffc4e8;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Portofolio Siswa - Kei Tedjo</h1>
    <p class="intro">Berikut daftar proyek yang telah saya kerjakan 💗</p>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Cari proyek... (misal: kartu, formulir)">
    </div>

    <div id="projectsContainer"></div>
  </div>

  <script>
    const projects = [
      { title: "Website Biodata Diri", img: "white.jpg", desc: "Menampilkan informasi pribadi dengan HTML & CSS dasar.", link: "Biodata.html" },
      { title: "Website Kartu Informasi", img: "pink.jpg", desc: "Kartu identitas digital dengan tampilan rapi dan manis.", link: "kartuinformasi.html" },
      { title: "Website Resep Makanan", img: "https://via.placeholder.com/800x300?text=Resep+Makanan", desc: "Berisi resep masakan favorit lengkap.", link: "#" },
      { title: "Website Kartu Undangan", img: "https://via.placeholder.com/800x300?text=Kartu+Undangan", desc: "Undangan digital cantik untuk acara spesial.", link: "#" },
      { title: "Website Formulir Online", img: "https://via.placeholder.com/800x300?text=Formulir+Online", desc: "Formulir pendaftaran online lengkap.", link: "#" },
      { title: "Website Jadwal Pelajaran", img: "https://via.placeholder.com/800x300?text=Jadwal+Pelajaran", desc: "Tabel jadwal pelajaran mingguan.", link: "#" },
      { title: "Website Project Akhir", img: "https://via.placeholder.com/800x300?text=Project+Akhir", desc: "Proyek gabungan seluruh materi HTML & CSS.", link: "#" },
      { title: "Website Ujian Praktek", img: "https://via.placeholder.com/800x300?text=Ujian+Praktek", desc: "Website hasil ujian praktik informatika.", link: "#" }
    ];

    function renderProjects(list = projects) {
      const container = document.getElementById("projectsContainer");
      container.innerHTML = list.map(p => `
        <div class="project">
          <h3>${p.title}</h3>
          <img src="${p.img}" alt="${p.title}">
          <p>${p.desc}</p>
          <a href="${p.link}" target="_blank"><button class="btn">Lihat Proyek</button></a>
          <button class="toggle-btn" onclick="toggleProject(this)">Sembunyikan</button>
        </div>
      `).join("");
    }
    renderProjects();

    function toggleProject(btn) {
      const card = btn.closest(".project");
      const img = card.querySelector("img");
      const p = card.querySelector("p");
      const hide = img.style.display !== "none";
      img.style.display = hide ? "none" : "block";
      p.style.display = hide ? "none" : "block";
      btn.textContent = hide ? "Tampilkan" : "Sembunyikan";
    }

    document.getElementById("searchInput").addEventListener("input", e => {
      const key = e.target.value.toLowerCase();
      renderProjects(projects.filter(p =>
        p.title.toLowerCase().includes(key) || p.desc.toLowerCase().includes(key)
      ));
    });
  </script>

</body>
</html>
